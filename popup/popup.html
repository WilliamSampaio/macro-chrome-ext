<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Selector Clicker</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main>
    <h1>Macro Clicker</h1>

    <p>Right-click any page element and choose "Save element for macro." Then run the saved steps in order.</p>

    <label>
      Delay between actions, ms
      <span class="delay-control">
        <input id="delayMs" type="number" min="0" step="50">
        <button id="save" class="save-delay-button" type="button" aria-label="Save delay" title="Save delay">
          <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"></path>
            <path d="M17 21v-8H7v8"></path>
            <path d="M7 3v5h8"></path>
          </svg>
        </button>
      </span>
    </label>

    <p id="status" role="status"></p>

    <label>
      Loop count
      <input id="loopCount" type="number" min="1" step="1" value="1">
    </label>

    <p id="executionCount">Total executions: 0</p>

    <div class="steps">
      <h2>Saved macro steps</h2>
      <ol id="macroList"></ol>
    </div>

    <div class="actions">
      <button id="run" type="button">Run macro</button>
      <button id="runLoop" type="button">Run loop</button>
      <button id="clear" type="button">Clear steps</button>
    </div>

    <div class="log">
      <h2>Run log</h2>
      <ul id="macroLog"></ul>
    </div>
  </main>

  <script src="popup.js"></script>
</body>

</html>
